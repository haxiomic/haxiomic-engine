<meta charset="utf-8">
<title>Render pass fixture</title>

<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js" } }
</script>
<script type="module">
import { BoxGeometry, Color, DataTexture, DirectionalLight, LinearMipmapLinearFilter, Mesh, MeshStandardMaterial, OrthographicCamera, PerspectiveCamera, PlaneGeometry, Scene, ShaderMaterial, Vector4, WebGLCubeRenderTarget, WebGLRenderTarget, WebGLRenderer } from 'three'
import { Rendering } from '/dist/rendering/Rendering.js'
import RenderTargetStore from '/dist/rendering/RenderTargetStore.js'
import { generateBlurredMipmaps } from '/dist/rendering/BlurredMipmapChain.js'
import { gaussianBlur } from '/dist/rendering/GaussianBlur.js'
import { pyramidBloom } from '/dist/rendering/PyramidBloom.js'
import { DualRenderTarget } from '/dist/rendering/DualRenderTarget.js'
import { FluidSimulation } from '/dist/fluid/FluidSimulation.js'

/* Rendering.renderPass and its helpers, as their options say: each case into a 64² target filled with junk first */

const SIZE = 64
const canvas = document.createElement('canvas')
canvas.width = canvas.height = SIZE
const renderer = new WebGLRenderer({ canvas })
renderer.setPixelRatio(1)
renderer.setSize(SIZE, SIZE, false)
renderer.shadowMap.enabled = true
const ortho = new OrthographicCamera(-1, 1, 1, -1, 0, 1)
const fill = (rgba) => new Mesh(new PlaneGeometry(2, 2), new ShaderMaterial({
    vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `void main() { gl_FragColor = vec4(${rgba.join(', ')}); }`,
}))
// junk: 204, 153, 51, 153
const junk = fill([0.8, 0.6, 0.2, 0.6])

function target() {
    const t = new WebGLRenderTarget(SIZE, SIZE, { depthBuffer: true, stencilBuffer: true })
    renderer.setRenderTarget(t)
    renderer.clear()
    renderer.render(junk, ortho)
    return t
}
function pixel(t, x, y) {
    const out = new Uint8Array(4)
    renderer.readRenderTargetPixels(t, x, y, 1, 1, out)
    return [...out]
}
const leftHalf = () => new Vector4(0, 0, SIZE / 2, SIZE)

/** a box on a floor, lit from above, casting a shadow or not */
function litScene(shadows) {
    const scene = new Scene()
    const light = new DirectionalLight(0xffffff, 3)
    light.position.set(2, 4, 3)
    light.castShadow = shadows
    const floor = new Mesh(new PlaneGeometry(1.6, 1.6), new MeshStandardMaterial({ color: 0x88aa66 }))
    floor.rotation.x = -Math.PI / 2
    floor.receiveShadow = true
    const box = new Mesh(new BoxGeometry(0.5, 0.5, 0.5), new MeshStandardMaterial({ color: 0xcc4444 }))
    box.position.y = 0.4
    box.castShadow = true
    scene.add(light, floor, box)
    const camera = new PerspectiveCamera(50, 1, 0.1, 20)
    camera.position.set(0, 1.5, 2.5)
    camera.lookAt(0, 0.2, 0)
    return { scene, camera }
}

/** the state saveGlobalState() records, as a known starting point: the canvas, viewport (1, 2, 3, 4), clear colour 00ff00 at 0.5 */
function setKnownState() {
    renderer.setRenderTarget(null)
    renderer.setViewport(1, 2, 3, 4)
    renderer.setClearColor(0x00ff00, 0.5)
}
/** what the renderer is left with, named: the canvas is null */
function globalState(names = new Map()) {
    const target = renderer.getRenderTarget()
    return {
        target: target === null ? null : names.get(target) ?? 'another target',
        viewport: renderer.getViewport(new Vector4()).toArray(),
        clearColor: renderer.getClearColor(new Color()).getHexString(),
        clearAlpha: renderer.getClearAlpha(),
    }
}

window.cases = {
    /** a blit into the left half with `clear`: the right half's pixel */
    blitRightHalf(clear) {
        const t = target()
        const green = new DataTexture(new Uint8Array([0, 255, 0, 255]), 1, 1)
        green.needsUpdate = true
        Rendering.blit(renderer, { source: green, target: t, viewport: leftHalf(), clear, restoreGlobalState: true })
        return pixel(t, SIZE - 2, 1)
    },

    /** a lit scene into the left half of a render target, its colour kept: the columns it drew in, and the target's viewport after */
    viewportOnTarget(shadows) {
        const t = target()
        const { scene, camera } = litScene(shadows)
        Rendering.renderPass(renderer, { target: t, scene, camera, viewport: leftHalf(), clearColor: false, clearDepth: true, restoreGlobalState: true })
        const out = new Uint8Array(SIZE * SIZE * 4)
        renderer.readRenderTargetPixels(t, 0, 0, SIZE, SIZE, out)
        let min = SIZE, max = -1
        for (let i = 0; i < out.length; i += 4) {
            if (out[i] === 204 && out[i + 1] === 153 && out[i + 2] === 51) continue
            const x = (i / 4) % SIZE
            min = Math.min(min, x)
            max = Math.max(max, x)
        }
        return { drawn: [min, max], targetViewport: t.viewport.toArray() }
    },

    /** a lit scene with a colour background, with `clearColor` and `clearDepth`: a corner pixel (nothing drawn there), and whether the background is back on the scene */
    colourBackground(clearColor, clearDepth) {
        const t = target()
        const { scene, camera } = litScene(true)
        const background = new Color(0x112233)
        scene.background = background
        Rendering.renderPass(renderer, { target: t, scene, camera, clearColor, clearDepth, restoreGlobalState: true })
        return { corner: pixel(t, 1, 1), backgroundKept: scene.background === background }
    },

    /** a pass restoring global state that runs another from inside its render(): what the renderer is left with */
    nestedRestore() {
        const outerTarget = target(), innerTarget = target()
        const scene = fill([1, 1, 1, 1])
        scene.onBeforeRender = () => Rendering.renderPass(renderer, { target: innerTarget, scene: fill([1, 0, 0, 1]), camera: ortho, clearColor: { rgb: 0xff0000, alpha: 1 }, clearDepth: true, restoreGlobalState: true })
        renderer.setRenderTarget(null)
        renderer.setViewport(1, 2, 3, 4)
        renderer.setClearColor(0x00ff00, 0.5)
        Rendering.renderPass(renderer, { target: outerTarget, scene, camera: ortho, clearColor: { rgb: 0x0000ff, alpha: 1 }, clearDepth: true, restoreGlobalState: true })
        const viewport = new Vector4()
        renderer.getViewport(viewport)
        return { target: renderer.getRenderTarget(), viewport: viewport.toArray(), clearColor: renderer.getClearColor(new Color()).getHexString(), clearAlpha: renderer.getClearAlpha() }
    },

    /** saveGlobalState(), then other state, then a helper that saves and restores its own (generateBlurredMipmaps), then restoreGlobalState() */
    nestedSave() {
        setKnownState()
        Rendering.saveGlobalState(renderer)
        const other = target()
        renderer.setRenderTarget(other)
        renderer.setViewport(0, 0, 8, 8)
        renderer.setClearColor(0xff0000, 1)
        const chain = new WebGLRenderTarget(SIZE, SIZE, { minFilter: LinearMipmapLinearFilter })
        generateBlurredMipmaps(renderer, { target: chain, blurKernel_heightFraction: 1 / 16 })
        Rendering.restoreGlobalState(renderer)
        return globalState(new Map([[other, 'other']]))
    },

    /** a save whose restore never runs (as when a throw skips it), inside a save restored by its snapshot */
    unrestoredInnerSave() {
        setKnownState()
        const outer = Rendering.saveGlobalState(renderer)
        const other = target()
        renderer.setRenderTarget(other)
        Rendering.saveGlobalState(renderer)
        Rendering.restoreGlobalState(renderer, outer)
        return globalState(new Map([[other, 'other']]))
    },

    /** passes inside a save: restoring or not, one throwing from inside render(), one from its override material */
    passesInsideSave() {
        setKnownState()
        Rendering.saveGlobalState(renderer)
        const t = target()
        const pass = (options) => Rendering.renderPass(renderer, { target: t, scene: fill([1, 1, 1, 1]), camera: ortho, clearColor: false, clearDepth: false, restoreGlobalState: false, ...options })
        pass({})
        pass({ restoreGlobalState: true })
        const throwing = fill([1, 1, 1, 1])
        throwing.onBeforeRender = () => { throw new Error('in render()') }
        try { pass({ scene: throwing, restoreGlobalState: true }) } catch { }
        try { pass({ overrideMaterial: () => { throw new Error('in the override') } }) } catch { }
        renderer.setRenderTarget(t)
        Rendering.restoreGlobalState(renderer)
        return globalState(new Map([[t, 'the passes\' target']]))
    },

    /** restoreGlobalState() without a snapshot, twice, after two saves (the second inside the first): what each puts back */
    latestSave() {
        setKnownState()
        Rendering.saveGlobalState(renderer)
        const other = target()
        renderer.setRenderTarget(other)
        renderer.setViewport(0, 0, 8, 8)
        renderer.setClearColor(0xff0000, 1)
        Rendering.saveGlobalState(renderer)
        const names = new Map([[other, 'other']])
        renderer.setRenderTarget(null)
        Rendering.restoreGlobalState(renderer)
        const first = globalState(names)
        renderer.setRenderTarget(null)
        Rendering.restoreGlobalState(renderer)
        return { first, second: globalState(names) }
    },

    /** a snapshot restored after another state has been saved and restored */
    snapshotKept() {
        setKnownState()
        const kept = Rendering.saveGlobalState(renderer)
        Rendering.restoreGlobalState(renderer, kept)
        const other = target()
        renderer.setRenderTarget(other)
        renderer.setViewport(0, 0, 8, 8)
        renderer.setClearColor(0xff0000, 1)
        Rendering.restoreGlobalState(renderer, Rendering.saveGlobalState(renderer))
        Rendering.restoreGlobalState(renderer, kept)
        return globalState(new Map([[other, 'other']]))
    },

    /** gaussianBlur() throwing after its snapshot, before its restore, inside a save restored without its snapshot */
    throwingHelperInsideSave() {
        setKnownState()
        Rendering.saveGlobalState(renderer)
        const other = target()
        renderer.setRenderTarget(other)
        const shaderMaterialPass = Rendering.shaderMaterialPass
        Rendering.shaderMaterialPass = () => { throw new Error('a pass threw') }
        let threw = null
        try {
            gaussianBlur(renderer, new RenderTargetStore(), other.texture, 9)
        } catch (e) {
            threw = e.message
        } finally {
            Rendering.shaderMaterialPass = shaderMaterialPass
        }
        Rendering.restoreGlobalState(renderer)
        return { threw, state: globalState(new Map([[other, 'other']])) }
    },

    /** the clear colour after gaussianBlur() and pyramidBloom(), which restore global state by default */
    blurClearColour() {
        const source = target()
        renderer.setRenderTarget(null)
        renderer.setClearColor(0x00ff00, 0.5)
        gaussianBlur(renderer, new RenderTargetStore(), source.texture, 9)
        const afterBlur = globalState()
        pyramidBloom(renderer, new RenderTargetStore(), source.texture, [{ sigma: 8, weight: 1 }])
        const afterBloom = globalState()
        return { afterBlur: [afterBlur.clearColor, afterBlur.clearAlpha], afterBloom: [afterBloom.clearColor, afterBloom.clearAlpha] }
    },

    /** each helper that restores its own state, run inside an app's save: the state after it, and after the app's restoreGlobalState() */
    helpersInsideSave() {
        const source = target()
        const helpers = {
            mipmaps: () => generateBlurredMipmaps(renderer, { target: new WebGLRenderTarget(SIZE, SIZE, { minFilter: LinearMipmapLinearFilter }), blurKernel_heightFraction: 1 / 16 }),
            antiAliasedMipmaps: () => generateBlurredMipmaps(renderer, { target: new WebGLRenderTarget(SIZE, SIZE, { minFilter: LinearMipmapLinearFilter }), blurKernel_heightFraction: 1 / 16, antiAliased: true }),
            gaussianBlur: () => gaussianBlur(renderer, new RenderTargetStore(), source.texture, 9),
            pyramidBloom: () => pyramidBloom(renderer, new RenderTargetStore(), source.texture, [{ sigma: 8, weight: 1 }]),
            fluidStep: () => {
                const fluid = new FluidSimulation(renderer, SIZE, SIZE, false, 1)
                const shader = fill([0, 0, 0, 1]).material
                const paint = (t) => Rendering.shaderMaterialPass(renderer, { target: t, shader, restoreGlobalState: false })
                fluid.step(1 / 60, paint, paint)
            },
            dualTargetResize: () => new DualRenderTarget(renderer, 16, 16, {}).resize(32, 32),
        }
        const other = target()
        const names = new Map([[other, 'other']])
        const states = {}
        for (const [name, helper] of Object.entries(helpers)) {
            setKnownState()
            Rendering.saveGlobalState(renderer)
            renderer.setRenderTarget(other)
            renderer.setViewport(0, 0, 8, 8)
            renderer.setClearColor(0xff0000, 1)
            helper()
            const afterHelper = globalState(names)
            Rendering.restoreGlobalState(renderer)
            states[name] = { afterHelper, afterRestore: globalState(names) }
        }
        return states
    },

    /** a cube target's face and mip level, through a save, a helper, a restoring pass and the restore */
    cubeFaceAndMipLevel() {
        const cube = new WebGLCubeRenderTarget(16, { generateMipmaps: true, minFilter: LinearMipmapLinearFilter })
        const source = target()
        const bound = () => [renderer.getRenderTarget() === cube, renderer.getActiveCubeFace(), renderer.getActiveMipmapLevel()]
        renderer.setRenderTarget(cube, 3, 1)
        const snapshot = Rendering.saveGlobalState(renderer)
        gaussianBlur(renderer, new RenderTargetStore(), source.texture, 9)
        const afterHelper = bound()
        Rendering.renderPass(renderer, { target: source, scene: fill([1, 1, 1, 1]), camera: ortho, clearColor: false, clearDepth: false, restoreGlobalState: true })
        const afterPass = bound()
        renderer.setRenderTarget(null)
        Rendering.restoreGlobalState(renderer)
        const afterRestore = bound()
        renderer.setRenderTarget(null)
        Rendering.restoreGlobalState(renderer, snapshot)
        const afterSnapshotRestore = bound()
        renderer.setRenderTarget(null)
        return { afterHelper, afterPass, afterRestore, afterSnapshotRestore }
    },

    /**
     * restoreGlobalState() with no save of the app's for what it just did: before any save; after a helper, then a pass
     * that doesn't restore; after a helper, with an earlier save of other state; after dispose()
     */
    restoreWithoutSave() {
        const t = target(), other = target()
        const names = new Map([[t, 'the pass\'s target'], [other, 'other']])
        const mipmaps = () => generateBlurredMipmaps(renderer, { target: new WebGLRenderTarget(SIZE, SIZE, { minFilter: LinearMipmapLinearFilter }), blurKernel_heightFraction: 1 / 16 })
        setKnownState()
        Rendering.restoreGlobalState(renderer)
        const beforeAnySave = globalState(names)

        setKnownState()
        mipmaps()
        Rendering.renderPass(renderer, { target: t, scene: fill([1, 1, 1, 1]), camera: ortho, clearColor: false, clearDepth: false, restoreGlobalState: false })
        Rendering.restoreGlobalState(renderer)
        const afterHelperAndPass = globalState(names).target

        renderer.setRenderTarget(other)
        renderer.setViewport(0, 0, 8, 8)
        renderer.setClearColor(0xff0000, 1)
        Rendering.saveGlobalState(renderer)
        setKnownState()
        mipmaps()
        Rendering.restoreGlobalState(renderer)
        const afterHelperWithEarlierSave = globalState(names)

        Rendering.dispose()
        setKnownState()
        Rendering.restoreGlobalState(renderer)
        const afterDispose = globalState(names)
        return { beforeAnySave, afterHelperAndPass, afterHelperWithEarlierSave, afterDispose }
    },

    /**
     * A pass with a per-object override material, and inside its render() (from the first mesh's onBeforeRender)
     * another on the same scene with another override: each mesh's material during the inner pass, back in the outer
     * pass after it, and after both
     */
    nestedPerObjectOverrides() {
        const t = target()
        const meshes = [fill([1, 1, 1, 1]), fill([1, 1, 1, 1])]
        const originals = meshes.map(m => m.material)
        const scene = new Scene()
        scene.add(...meshes)
        const outer = new Map(), inner = new Map()
        const pass = (materials) => Rendering.renderPass(renderer, {
            target: t, scene, camera: ortho, clearColor: false, clearDepth: false, restoreGlobalState: true,
            overrideMaterial: (obj) => {
                if (!materials.has(obj)) materials.set(obj, obj.material.clone())
                return materials.get(obj)
            },
        })
        const which = () => meshes.map((m, i) => m.material === originals[i] ? 'original' : m.material === outer.get(m) ? 'outer' : m.material === inner.get(m) ? 'inner' : 'other')
        let during = null, afterInner = null
        meshes[1].onBeforeRender = () => { if (during === null && afterInner === null && inner.size > 0) during = which() }
        let nested = false
        meshes[0].onBeforeRender = () => {
            if (nested) return
            nested = true
            pass(inner)
            afterInner = which()
        }
        pass(outer)
        return { during, afterInner, after: which() }
    },
}
window.ready = true
</script>
